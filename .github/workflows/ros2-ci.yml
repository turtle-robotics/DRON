name: ROS 2 CI

on:
  pull_request:
    paths:
      - "ros2_ws/**"
      - ".github/workflows/ros2-ci.yml"
  push:
    branches: [main]
    paths:
      - "ros2_ws/**"
      - ".github/workflows/ros2-ci.yml"

permissions:
  contents: read

concurrency:
  group: ros2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ROS 2 / Build & Test
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-rosdep

      # The workspace contains legacy and hardware-specific packages that do not
      # currently build cleanly in generic CI. Keep failures visible but non-blocking
      # until a supported ROS package baseline is established.
      - name: Install package dependencies
        continue-on-error: true
        run: |
          rosdep update --include-eol-distros
          # --ignore-src: build in-workspace packages instead of apt.
          # --skip-keys: keys with no rosdep entry (verified against the
          # rosdistro rosdep database). senxor is vendored in the repo;
          # matplotlib, cv2, and spidev are Python modules with no
          # rosdep key (pip installs: matplotlib, opencv, spidev);
          # cmapy, board, busio, and adafruit_gps (Adafruit Blinka) are
          # installed with pip on the drone's Raspberry Pi.
          rosdep install --from-paths ros2_ws/src --ignore-src -r -y \
            --skip-keys "senxor matplotlib cv2 spidev cmapy board busio adafruit_gps"

      - name: Build workspace
        working-directory: ros2_ws
        continue-on-error: true
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct-

      - name: Run tests
        working-directory: ros2_ws
        continue-on-error: true
        run: |
          source /opt/ros/humble/setup.bash
          if [ -f install/setup.bash ]; then
            source install/setup.bash
          fi
          colcon test --event-handlers console_direct-

      - name: Report test results
        working-directory: ros2_ws
        if: always()
        continue-on-error: true
        run: |
          colcon test-result --verbose | tee "$GITHUB_STEP_SUMMARY"
